<!DOCTYPE html>
<html>
<head>
    <title>Background Blur - GPU</title>
    <style>
        * { margin: 0; padding: 0; }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scaleX(-1);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        .blur-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            pointer-events: none;
        }

        .btn-container {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .btn:hover { transform: scale(1.05); }
        .btn-capture { background: #ff6b6b; }
        .btn-capture:hover { background: #ee5a24; }

        .status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: white;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            display: none;
        }

        .info {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            z-index: 10;
            font-size: 12px;
            background: rgba(0,0,0,0.3);
            padding: 6px 12px;
            border-radius: 8px;
        }

        @media (max-width: 600px) {
            .btn { padding: 12px 18px; font-size: 14px; }
            .btn-container { gap: 10px; bottom: 20px; }
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <div class="blur-overlay"></div>
    
    <div class="info">📷 Background Blur - Klik tombol untuk ambil foto</div>
    <div class="status" id="status">📸 Foto tersimpan!</div>

    <div class="btn-container">
        <button class="btn btn-capture" id="btnCapture">📸 Ambil Foto</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const status = document.getElementById('status');
        const btnCapture = document.getElementById('btnCapture');

        // ======== SETTING BLUR ========
        const blurSize = 30; // SAMAIN DENGAN CSS (5, 15, 25, 30, 50)
        // ==============================

        // ======== MULAI KAMERA ========
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' } 
                });
                video.srcObject = stream;
            } catch (err) {
                alert('Izin kamera ditolak!');
                console.error(err);
            }
        }

        startCamera();

        // ======== FUNGSI BLUR ========
        function applyBlur(canvas) {
            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            const half = Math.floor(blurSize / 2);
            const tempData = new Uint8ClampedArray(data);
            
            for (let y = 0; y < canvas.height; y++) {
                for (let x = 0; x < canvas.width; x++) {
                    const idx = (y * canvas.width + x) * 4;
                    let r = 0, g = 0, b = 0, count = 0;
                    
                    for (let dy = -half; dy <= half; dy++) {
                        for (let dx = -half; dx <= half; dx++) {
                            const nx = x + dx;
                            const ny = y + dy;
                            if (nx >= 0 && nx < canvas.width && ny >= 0 && ny < canvas.height) {
                                const nIdx = (ny * canvas.width + nx) * 4;
                                r += tempData[nIdx];
                                g += tempData[nIdx + 1];
                                b += tempData[nIdx + 2];
                                count++;
                            }
                        }
                    }
                    
                    if (count > 0) {
                        data[idx] = r / count;
                        data[idx + 1] = g / count;
                        data[idx + 2] = b / count;
                    }
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
        }

        // ======== AMBIL FOTO ========
        btnCapture.addEventListener('click', () => {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            
            // Blur foto
            applyBlur(canvas);
            
            // Download otomatis
            const link = document.createElement('a');
            link.download = `foto-blur-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            
            showStatus('📸 Foto BLUR berhasil diambil!');
        });

        // ======== STATUS SEMENTARA ========
        function showStatus(msg) {
            status.textContent = msg;
            status.style.display = 'block';
            setTimeout(() => {
                status.style.display = 'none';
            }, 3000);
        }

        // ======== KEYBOARD SHORTCUT ========
        document.addEventListener('keydown', (e) => {
            if (e.key === 'q' || e.key === 'Q') {
                location.reload();
            }
        });
    </script>
</body>
</html>
