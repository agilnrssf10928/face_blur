<!DOCTYPE html>
<html>
<head>
    <title>Blur Kamera</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            touch-action: manipulation;
        }
        
        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scaleX(-1);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        .blur-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            pointer-events: none;
        }

        .btn-container {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 90%;
            max-width: 400px;
        }

        .btn-capture {
            width: 100%;
            padding: 20px 30px;
            border: none;
            border-radius: 60px;
            font-size: 28px;
            font-weight: bold;
            color: white;
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(255, 107, 107, 0.4);
            transition: all 0.1s ease;
            touch-action: manipulation;
            letter-spacing: 1px;
        }

        .btn-capture:active {
            transform: scale(0.95);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.2);
        }

        .btn-capture:disabled {
            opacity: 0.6;
            transform: scale(0.95);
        }

        .status {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            color: white;
            background: rgba(0,0,0,0.8);
            padding: 16px 30px;
            border-radius: 16px;
            font-size: 20px;
            display: none;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
            min-width: 200px;
        }

        .info {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.4);
            z-index: 10;
            font-size: 16px;
            background: rgba(0,0,0,0.3);
            padding: 8px 16px;
            border-radius: 10px;
            text-align: center;
            white-space: nowrap;
        }

        /* TULISAN DI TOMBOL */
        .btn-icon {
            font-size: 32px;
            margin-right: 12px;
        }
        .btn-text {
            font-size: 28px;
        }

        /* HP */
        @media (max-width: 600px) {
            .btn-capture {
                padding: 18px 20px;
                font-size: 24px;
                border-radius: 50px;
            }
            .btn-icon { font-size: 28px; }
            .btn-text { font-size: 24px; }
            .status { font-size: 18px; padding: 14px 20px; top: 20px; min-width: 150px; }
            .info { font-size: 14px; top: 80px; }
        }

        @media (max-width: 400px) {
            .btn-capture {
                padding: 16px 16px;
                font-size: 20px;
            }
            .btn-icon { font-size: 24px; }
            .btn-text { font-size: 20px; }
            .status { font-size: 16px; padding: 12px 16px; }
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <div class="blur-overlay"></div>
    
    <div class="info">📸 Klik tombol untuk ambil foto blur</div>
    <div class="status" id="status">✅ Foto berhasil!</div>

    <div class="btn-container">
        <button class="btn-capture" id="btnCapture">
            <span class="btn-icon">📸</span>
            <span class="btn-text">Ambil Foto</span>
        </button>
    </div>

    <script>
        const video = document.getElementById('video');
        const status = document.getElementById('status');
        const btnCapture = document.getElementById('btnCapture');

        // ======== SETTING BLUR ========
        const blurSize = 30; // 5 = tipis, 30 = sedang, 50 = keras
        // ==============================

        let isProcessing = false;

        // ======== MULAI KAMERA ========
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: 'user',
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                });
                video.srcObject = stream;
                await video.play();
            } catch (err) {
                alert('Izin kamera ditolak!');
                console.error(err);
            }
        }

        startCamera();

        // ======== FUNGSI BLUR (CEPAT) ========
        function applyBlur(canvas) {
            const ctx = canvas.getContext('2d');
            const width = canvas.width;
            const height = canvas.height;
            
            // Ambil gambar
            ctx.drawImage(video, 0, 0, width, height);
            
            // Blur pake stack blur (lebih cepat)
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            const tempData = new Uint8ClampedArray(data);
            
            const radius = Math.floor(blurSize / 2);
            const size = radius * 2 + 1;
            const sizeSq = size * size;
            
            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const idx = (y * width + x) * 4;
                    let r = 0, g = 0, b = 0;
                    
                    for (let dy = -radius; dy <= radius; dy++) {
                        for (let dx = -radius; dx <= radius; dx++) {
                            const nx = Math.min(width - 1, Math.max(0, x + dx));
                            const ny = Math.min(height - 1, Math.max(0, y + dy));
                            const nIdx = (ny * width + nx) * 4;
                            r += tempData[nIdx];
                            g += tempData[nIdx + 1];
                            b += tempData[nIdx + 2];
                        }
                    }
                    
                    data[idx] = r / sizeSq;
                    data[idx + 1] = g / sizeSq;
                    data[idx + 2] = b / sizeSq;
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
        }

        // ======== AMBIL FOTO ========
        btnCapture.addEventListener('click', async () => {
            if (isProcessing) return;
            if (!video.videoWidth) {
                showStatus('⏳ Tunggu kamera siap...');
                return;
            }

            isProcessing = true;
            btnCapture.disabled = true;
            showStatus('📸 Memproses...');

            // Pake setTimeout biar UI keburu update
            await new Promise(r => setTimeout(r, 50));

            const canvas = document.createElement('canvas');
            const width = video.videoWidth;
            const height = video.videoHeight;
            canvas.width = width;
            canvas.height = height;
            
            // Blur
            applyBlur(canvas);
            
            // Download
            const link = document.createElement('a');
            link.download = `foto-blur-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png', 0.95);
            link.click();
            
            showStatus('✅ Foto BLUR berhasil!');
            
            isProcessing = false;
            btnCapture.disabled = false;
        });

        // ======== STATUS ========
        function showStatus(msg) {
            status.textContent = msg;
            status.style.display = 'block';
            clearTimeout(window.statusTimeout);
            window.statusTimeout = setTimeout(() => {
                status.style.display = 'none';
            }, 2500);
        }

        // ======== KEYBOARD ========
        document.addEventListener('keydown', (e) => {
            if (e.key === 'q' || e.key === 'Q') {
                location.reload();
            }
        });
    </script>
</body>
</html>
