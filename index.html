<!DOCTYPE html>
<html>
<head>
    <title>Background Blur - GPU</title>
    <style>
        * { margin: 0; padding: 0; }
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        video {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            transform: scaleX(-1);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        /* LAPISAN BLUR (DI ATAS VIDEO) */
        .blur-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            /* ======== SETTING BLUR ======== */
            backdrop-filter: blur(30px); /* GANTI ANGKA INI (5-50) */
            -webkit-backdrop-filter: blur(30px); /* BUAT SAFARI */
            /* ============================== */
            pointer-events: none; /* BIAR KLIK BISA TEMBUS */
        }
        
        /* LAPISAN MUKA (TEMBUS BLUR) - PAKAI CLIP-PATH */
        .face-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 3;
            pointer-events: none;
            /* MUKA TEMBUS PAKAI MASK (TAPI GAK BISA DETECT WAJAH OTOMATIS) */
        }

        .info {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 12px 24px;
            border-radius: 12px;
            font-family: Arial;
            z-index: 10;
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <div class="blur-overlay"></div>
    <div class="info">📷 Background Blur (GPU) - KAMERA LANCAR!</div>

    <script>
        const video = document.getElementById('video');

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' } 
                });
                video.srcObject = stream;
            } catch (err) {
                alert('Izin kamera ditolak!');
                console.error(err);
            }
        }

        startCamera();
    </script>
</body>
</html>
